version: '3.8'
services:
  redis:
    image: redis:7
    container_name: tc_local_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

# Usage:
# docker compose -f docker-compose.redis.yml up -d
# docker compose -f docker-compose.redis.yml down
