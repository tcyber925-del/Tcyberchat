name: CI

on:
  push:
    branches: [ sync/full-workspace-2025-10-26 ]
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Set to "1" to run integration tests'
        required: false
        default: '1'

# Use anchors to define common steps
x-common-steps:
  - &checkout
    uses: actions/checkout@v4
  - &setup-python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
  - &cache-pip
    uses: actions/cache@v4
    with:
      path: ~/.cache/pip
      key: ${{ runner.os }}-pip-${{ hashFiles('**/backend/requirements.txt') }}
      restore-keys: |
        ${{ runner.os }}-pip-

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - *checkout
      - *setup-python
      - *cache-pip
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .

  mypy-typecheck:
    runs-on: ubuntu-latest
    needs: ruff-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - *checkout
      - *setup-python
      - *cache-pip
      - name: Install type deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy
      - name: Mypy type check
        env:
          MYPYPATH: backend
        run: mypy src

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - *checkout
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false
      - name: Get pnpm store directory (lint)
        id: pnpm-cache-lint
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store (lint)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-lint.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install deps (lint)
        run: pnpm install --frozen-lockfile=false
      - name: Lint (frontend)
        run: pnpm run lint

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - *checkout
      - *setup-python
      - *cache-pip
      - name: Install type deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy
      - name: Mypy type check
        env:
          MYPYPATH: backend
        run: mypy src
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint (backend)
        run: ruff check .

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - *checkout
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false
      - name: Get pnpm store directory (tests)
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store (tests)
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install frontend dependencies
        run: pnpm install
      - name: Run frontend tests (CI)
        env:
          CI: 'true'
        run: pnpm test -- --ci --watchAll=false

  # Call the reusable backend workflow for tests (no integration)
  backend-tests:
    uses: ./.github/workflows/backend-ci.yml
    needs:
      - backend-lint
      - mypy-typecheck
    with:
      run_integration: '0'

  # Conditionally call the reusable backend workflow to run integration tests
  backend-integration-tests:
    needs: backend-tests
    if: >
      github.event.inputs.run_integration == '1' ||
      github.ref_name == 'sync/full-workspace-2025-10-26' ||
      (github.event_name == 'pull_request' && github.base_ref == 'sync/full-workspace-2025-10-26')
    uses: ./.github/workflows/backend-ci.yml
    with:
      run_integration: '1'