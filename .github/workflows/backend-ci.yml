name: Backend CI (reusable)

on:
  workflow_call:
    inputs:
      run_integration:
        description: 'Set to "1" to run integration tests'
        required: false
        default: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/unit -q --junitxml=reports/unit-junit.xml

      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-report
          path: backend/reports/unit-junit.xml

      - name: Run contract tests
        run: |
          mkdir -p reports
          pytest tests/contract -q --junitxml=reports/contract-junit.xml

      - name: Upload contract test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-test-report
          path: backend/reports/contract-junit.xml

      - name: Install integration deps & start services
        if: ${{ inputs.run_integration == '1' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          nohup python -u scripts/seed_chroma.py &
          sleep 1
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 6

      - name: Run integration tests
        if: ${{ inputs.run_integration == '1' }}
        run: |
          mkdir -p reports
          pytest tests/integration -q --junitxml=reports/integration-junit.xml

      - name: Upload integration test report
        if: ${{ always() && inputs.run_integration == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-report
          path: backend/reports/integration-junit.xml

      - name: Upload backend logs
        if: ${{ always() && inputs.run_integration == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            backend/logs/**
            backend/.venv/**/pip-log.txt