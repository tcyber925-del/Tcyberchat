name: Backend CI (trigger on backend changes)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  call-backend:
    uses: ../../.github/workflows/backend-ci.yml
    with:
      run_integration: '0'