version: '3.8'
services:
  frontend:
    image: tcyber_frontend:offline
    build: null
    container_name: tcyber_frontend_offline_compose
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Note: We use the existing verified backend image and expose ports for direct access
  backend:
    build: null
    image: tcyberchatbot-backend:latest
    container_name: tcyber_backend_offline_compose
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    # Ensure it uses the same network as others (implied by compose, but good to note)

  redis:
    ports:
      - "6379:6379"
