# ==============================================================================
# Nginx Configuration for TcyberChatbot
# Reverse proxy for frontend and backend services
# ==============================================================================

# Detect the real protocol (https if behind tunnel, http if local)
# This respects the X-Forwarded-Proto header from the tunnel (e.g. Tailscale/Cloudflare)
# If missing (local access), it falls back to the local scheme (http).
map $http_x_forwarded_proto $public_protocol {
    default $scheme;
    https https;
    http http;
}

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Max body size for file uploads
    client_max_body_size 100M;

    # Nginx self-health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    # ===========================================================================
    # Backend API Routes
    # ===========================================================================
    
    # Special routing for Chat API (handled by Next.js API route for streaming)
    # This must come BEFORE general /api/ to prevent /api/ block from stealing it
    location /api/chat {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_protocol;
        
        # Websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # All these paths should be proxied directly to the FastAPI backend
    location ~ ^/(api/|documents|health|docs|redoc|openapi.json) {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_protocol;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # SSE (Server-Sent Events) support - critical for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering "no";
        chunked_transfer_encoding on;
        
        # Long timeout for streaming/research endpoints
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # ===========================================================================
    # Frontend Routes (everything else)
    # ===========================================================================
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_protocol;
        
        # WebSocket support for Next.js hot reload (dev) and HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js static files with caching
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}